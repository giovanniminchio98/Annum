<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Annum — A Chronicle of History</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Inter:wght@300;400;500;600&family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #080818;
  --accent: #9a7ac8;
  --text: #d8d0f0;
  --header-h: 108px;
  --scroller-w: 220px;
}

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  color: var(--text);
  transition: background-color 0.6s ease, color 0.6s ease;
}

/* ── HEADER ── */
#header {
  position: fixed; top: 0; left: 0; right: 0; z-index: 200;
  height: var(--header-h);
  display: flex; flex-direction: column;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid rgba(255,255,255,0.07);
}

/* Title bar */
#header-title-bar {
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  height: 36px;
  border-bottom: 1px solid rgba(201,169,110,0.18);
  background: rgba(0,0,0,0.25);
}

#app-title {
  font-family: 'Cinzel Decorative', serif;
  font-size: 0.8rem; font-weight: 700;
  letter-spacing: 0.45em;
  color: #c9a96e;
  text-shadow: 0 0 24px rgba(201,169,110,0.45);
  text-transform: uppercase;
}

/* Row 1: year/era + fate meter */
#header-row1 {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 18px;
  flex: 1; min-height: 0;
  gap: 10px;
}

#header-info {
  display: flex; align-items: center; gap: 12px;
  flex-shrink: 0;
}

#current-year-display {
  font-family: 'Playfair Display', serif;
  font-size: 1.35rem; font-weight: 700;
  color: var(--accent);
  transition: color 0.6s;
  white-space: nowrap;
}

#era-name-display {
  font-size: 0.7rem; font-weight: 500;
  color: rgba(255,255,255,0.5);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  white-space: nowrap;
  max-width: 130px;
  overflow: hidden;
  text-overflow: ellipsis;
}

#fate-meter {
  display: flex; align-items: center; gap: 6px;
  font-size: 0.7rem; color: rgba(255,255,255,0.55);
  flex-shrink: 0;
}
#fate-bar-wrap {
  width: 90px; height: 6px;
  background: rgba(255,255,255,0.1);
  border-radius: 3px; overflow: hidden;
}
#fate-bar-hero {
  height: 100%;
  background: linear-gradient(90deg, #22c55e, #4ade80);
  border-radius: 3px;
  transition: width 0.6s ease;
}

/* Row 2: controls */
#header-row2 {
  display: flex; align-items: center; justify-content: center;
  padding: 0 18px 7px;
  gap: 8px;
  flex-shrink: 0;
}

.hdr-btn {
  background: rgba(255,255,255,0.07);
  border: 1px solid rgba(255,255,255,0.13);
  color: var(--text);
  border-radius: 6px;
  padding: 5px 10px;
  font-size: 0.75rem; font-family: 'Inter', sans-serif;
  cursor: pointer;
  transition: background 0.2s, color 0.6s, border-color 0.6s;
  white-space: nowrap;
}
.hdr-btn:hover { background: rgba(255,255,255,0.14); }
.hdr-btn.active { background: var(--accent); color: #000; border-color: var(--accent); }

#speed-select {
  background: rgba(255,255,255,0.07);
  border: 1px solid rgba(255,255,255,0.13);
  color: var(--text);
  border-radius: 6px;
  padding: 5px 6px;
  font-size: 0.75rem;
  cursor: pointer;
}

/* ── MAIN LAYOUT ── */
#main {
  position: fixed;
  top: var(--header-h); left: 0; right: 0; bottom: 0;
  display: flex;
  padding: 10px;
  gap: 10px;
  background: var(--bg);
  transition: background 0.6s ease;
}

/* ── DETAIL PANEL ── */
#detail {
  flex: 1;
  position: relative;
  overflow: hidden;
  background: var(--bg);
  transition: background 0.6s ease;
  border-radius: 16px;
  border: 1px solid rgba(255,255,255,0.09);
  box-shadow: 0 8px 32px rgba(0,0,0,0.45);
  display: flex;
  flex-direction: column;
}

#detail-bg-gradient {
  position: absolute; inset: 0;
  background: radial-gradient(ellipse at 30% 60%, color-mix(in srgb, var(--accent) 18%, transparent), transparent 65%),
              radial-gradient(ellipse at 80% 20%, color-mix(in srgb, var(--accent) 8%, transparent), transparent 50%);
  transition: background 0.6s ease;
  pointer-events: none;
}

#detail-symbol {
  position: absolute;
  bottom: -2rem; right: -1rem;
  font-size: 25rem; line-height: 1;
  opacity: 0.05;
  pointer-events: none;
  transition: opacity 0.4s;
  user-select: none;
}

#detail-content {
  flex: 1;
  min-height: 0;
  display: flex; flex-direction: column;
  align-items: center;
  padding: 1.5rem 1.5rem 1rem;
  overflow-y: auto;
  overscroll-behavior: contain;
  transition: opacity 0.35s ease, transform 0.35s ease;
  scrollbar-width: thin;
  scrollbar-color: rgba(255,255,255,0.15) transparent;
}
#detail-content::-webkit-scrollbar { width: 4px; }
#detail-content::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }
#detail-content.fading {
  opacity: 0;
  transform: translateY(10px);
}

#detail-card {
  background: rgba(0,0,0,0.42);
  border: 1px solid rgba(255,255,255,0.09);
  backdrop-filter: blur(12px);
  border-radius: 14px;
  padding: 1.4rem 1.6rem;
  max-width: 560px;
  width: 100%;
}

#detail-era-badge {
  display: inline-block;
  font-size: 0.65rem; font-weight: 600;
  letter-spacing: 0.12em; text-transform: uppercase;
  padding: 3px 10px;
  border-radius: 20px;
  border: 1px solid var(--accent);
  color: var(--accent);
  margin-bottom: 1rem;
  transition: color 0.6s, border-color 0.6s;
}

#detail-year {
  font-family: 'Playfair Display', serif;
  font-weight: 900;
  line-height: 1;
  color: var(--text);
  margin-bottom: 0.7rem;
  transition: color 0.6s, font-size 0.3s;
}

.detail-badges {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 0.8rem;
}

#detail-type-badge {
  font-size: 0.65rem; font-weight: 700;
  letter-spacing: 0.1em; text-transform: uppercase;
  padding: 3px 10px;
  border-radius: 20px;
}
.badge-hero   { background: rgba(34,197,94,0.2);  color: #4ade80; border: 1px solid rgba(34,197,94,0.4); }
.badge-villain{ background: rgba(239,68,68,0.2);  color: #f87171; border: 1px solid rgba(239,68,68,0.4); }
.badge-mixed  { background: rgba(251,146,60,0.2); color: #fb923c; border: 1px solid rgba(251,146,60,0.4); }

#detail-title {
  font-family: 'Playfair Display', serif;
  font-size: 1.45rem; font-weight: 700;
  color: var(--text);
  margin-bottom: 0.35rem;
  transition: color 0.6s;
  line-height: 1.2;
}

#detail-subtitle {
  font-size: 0.9rem;
  color: rgba(255,255,255,0.55);
  margin-bottom: 1.1rem;
  font-style: italic;
}

#detail-narrative {
  font-size: 0.9rem; line-height: 1.7;
  color: var(--text);
  opacity: 0.88;
  margin-bottom: 1rem;
  transition: color 0.6s;
}

#detail-time-gap {
  font-size: 0.75rem;
  color: rgba(255,255,255,0.38);
  margin-bottom: 1rem;
  letter-spacing: 0.02em;
}


/* Nav footer bar */
#detail-nav-bar {
  flex-shrink: 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0.65rem 1.2rem;
  border-top: 1px solid rgba(255,255,255,0.07);
  background: rgba(0,0,0,0.25);
  position: relative;
  z-index: 2;
}
.detail-nav {
  background: rgba(0,0,0,0.4);
  border: 1px solid rgba(255,255,255,0.12);
  color: var(--text);
  border-radius: 8px;
  padding: 7px 18px;
  font-size: 0.8rem;
  cursor: pointer;
  transition: background 0.2s;
  backdrop-filter: blur(6px);
}
.detail-nav:hover { background: rgba(255,255,255,0.1); }

/* ── SCROLLER ── */
#scroller-wrap {
  width: var(--scroller-w);
  flex-shrink: 0;
  position: relative;
  background: rgba(0,0,0,0.35);
  overflow: hidden;
  border-radius: 16px;
  border: 1px solid rgba(255,255,255,0.09);
  box-shadow: 0 8px 32px rgba(0,0,0,0.45);
}

/* Cursor line at 33% from top of scroller */
#cursor-line {
  position: absolute;
  left: 0; right: 0;
  top: 33%;
  height: 2px;
  background: var(--accent);
  z-index: 10;
  pointer-events: none;
  transition: background 0.6s;
  box-shadow: 0 0 8px var(--accent);
}

#scroller {
  height: 100%;
  overflow-y: scroll;
  overflow-x: hidden;
  scrollbar-width: thin;
  scrollbar-color: rgba(255,255,255,0.15) transparent;
  padding-bottom: 60%;
  padding-top: 0;
  scroll-behavior: auto;
}
#scroller::-webkit-scrollbar { width: 4px; }
#scroller::-webkit-scrollbar-track { background: transparent; }
#scroller::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }

#scroller-progress {
  position: absolute;
  bottom: 6px; left: 0; right: 0;
  text-align: center;
  font-size: 0.6rem;
  color: rgba(255,255,255,0.3);
  pointer-events: none;
  z-index: 5;
}

/* Era section headers */
.era-header {
  position: sticky; top: 0;
  background: rgba(0,0,0,0.75);
  backdrop-filter: blur(8px);
  padding: 4px 8px;
  font-size: 0.6rem; font-weight: 600;
  letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--accent);
  border-bottom: 1px solid rgba(255,255,255,0.06);
  z-index: 2;
}

/* Scroller event row */
.scroll-item {
  height: 44px;
  display: flex; align-items: center;
  padding: 0 8px;
  gap: 7px;
  cursor: pointer;
  border-left: 3px solid transparent;
  transition: background 0.2s, border-color 0.2s;
  position: relative;
}
.scroll-item:hover { background: rgba(255,255,255,0.05); }
.scroll-item.active {
  border-left-color: var(--accent) !important;
  background: rgba(255,255,255,0.1);
}

.scroll-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}

.scroll-year {
  font-size: 0.72rem; font-weight: 700;
  white-space: nowrap;
  flex-shrink: 0;
  min-width: 50px;
}

.scroll-title {
  font-size: 0.68rem;
  opacity: 0.6;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  flex: 1;
}

/* ── YEAR SELECTOR MODAL ── */
#modal-overlay {
  position: fixed; inset: 0; z-index: 500;
  background: rgba(0,0,0,0.85);
  backdrop-filter: blur(16px);
  display: none;
  flex-direction: column;
  padding: 1.5rem;
}
#modal-overlay.open { display: flex; }

#modal-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 1rem;
}
#modal-title {
  font-family: 'Playfair Display', serif;
  font-size: 1.4rem; font-weight: 700;
  color: var(--text);
}
#modal-close {
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.15);
  color: var(--text);
  border-radius: 8px;
  padding: 6px 14px;
  font-size: 0.8rem; cursor: pointer;
}

#modal-search {
  width: 100%;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 8px;
  padding: 10px 14px;
  font-size: 0.9rem; font-family: 'Inter', sans-serif;
  color: var(--text);
  margin-bottom: 1rem;
  outline: none;
}
#modal-search::placeholder { color: rgba(255,255,255,0.3); }

#modal-era-chips {
  display: flex; flex-wrap: wrap; gap: 6px;
  margin-bottom: 1rem;
}
.era-chip {
  font-size: 0.65rem; font-weight: 600;
  letter-spacing: 0.08em; text-transform: uppercase;
  padding: 4px 10px;
  border-radius: 20px;
  cursor: pointer;
  border: 1px solid rgba(255,255,255,0.2);
  color: rgba(255,255,255,0.7);
  transition: background 0.2s, color 0.2s;
}
.era-chip:hover { background: rgba(255,255,255,0.15); color: #fff; }

#modal-grid {
  flex: 1;
  overflow-y: auto;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 6px;
  align-content: start;
  scrollbar-width: thin;
  scrollbar-color: rgba(255,255,255,0.15) transparent;
}
#modal-grid::-webkit-scrollbar { width: 4px; }
#modal-grid::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }

.modal-item {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 8px;
  padding: 10px 12px;
  cursor: pointer;
  transition: background 0.15s, transform 0.15s;
  border-left: 3px solid transparent;
}
.modal-item:hover { background: rgba(255,255,255,0.1); transform: translateY(-1px); }
.modal-item-year {
  font-size: 0.7rem; font-weight: 700;
  margin-bottom: 3px;
}
.modal-item-title {
  font-size: 0.75rem;
  opacity: 0.75;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* ── TIME CAPSULE MODAL ── */
#capsule-overlay {
  position: fixed; inset: 0; z-index: 600;
  background: rgba(0,0,0,0.85);
  backdrop-filter: blur(16px);
  display: none;
  align-items: center; justify-content: center;
}
#capsule-overlay.open { display: flex; }

#capsule-modal {
  background: rgba(20,20,30,0.95);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 16px;
  padding: 2rem;
  max-width: 480px; width: 90%;
}
#capsule-modal h3 {
  font-family: 'Playfair Display', serif;
  font-size: 1.2rem; margin-bottom: 0.5rem;
  color: var(--text);
}
#capsule-modal p {
  font-size: 0.8rem; color: rgba(255,255,255,0.5);
  margin-bottom: 1rem;
}
#capsule-text {
  width: 100%;
  background: rgba(255,255,255,0.07);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 8px;
  padding: 10px 12px;
  color: var(--text);
  font-family: 'Inter', sans-serif; font-size: 0.85rem;
  resize: vertical; min-height: 100px;
  outline: none;
  margin-bottom: 1rem;
}
.capsule-notes {
  margin-bottom: 1rem;
}
.capsule-note-item {
  background: rgba(255,255,255,0.05);
  border-radius: 6px; padding: 8px 10px;
  margin-bottom: 6px;
  font-size: 0.78rem;
}
.capsule-note-date { font-size: 0.65rem; opacity: 0.45; margin-bottom: 3px; }
.capsule-btns { display: flex; gap: 8px; justify-content: flex-end; }
.capsule-btns button {
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15);
  color: var(--text);
  border-radius: 7px;
  padding: 7px 16px;
  font-size: 0.8rem; cursor: pointer;
}
.capsule-btns button.primary {
  background: var(--accent);
  color: #000; border-color: var(--accent);
}

/* Play button distinct style */
#play-btn {
  background: rgba(255,255,255,0.12) !important;
  border-color: var(--accent) !important;
  color: var(--accent) !important;
  font-weight: 600;
  letter-spacing: 0.04em;
  transition: background 0.2s, color 0.6s, border-color 0.6s, box-shadow 0.2s;
}
#play-btn:hover { background: rgba(255,255,255,0.22) !important; box-shadow: 0 0 10px color-mix(in srgb, var(--accent) 40%, transparent); }
#play-btn.active { background: var(--accent) !important; color: #000 !important; box-shadow: 0 0 14px color-mix(in srgb, var(--accent) 60%, transparent); }

/* ── RESPONSIVE ── */
@media (max-width: 640px) {
  :root { --scroller-w: 150px; --header-h: 100px; }
  #main { padding: 7px; gap: 7px; }
  #header-title-bar { height: 30px; }
  #app-title { font-size: 0.68rem; letter-spacing: 0.4em; }
  #era-name-display { display: none; }
  #fate-meter span { display: none; }
  #fate-bar-wrap { width: 60px; }
  #header-row2 { gap: 6px; padding-bottom: 6px; }
  .hdr-btn { padding: 5px 8px; font-size: 0.7rem; }
  #detail-title { font-size: 1.15rem; }
  #detail-narrative { font-size: 0.84rem; }
  #detail-symbol { font-size: 10rem; }
  #detail-card { padding: 1rem 1.1rem; }
  .detail-nav { padding: 6px 12px; font-size: 0.75rem; }
  .scroll-title { display: none; }
  .scroll-year { min-width: 38px; font-size: 0.65rem; }
}

@media (max-width: 390px) {
  :root { --scroller-w: 120px; }
  #detail-year { font-size: 1.6rem !important; }
  #detail-title { font-size: 1rem; }
}
</style>
</head>
<body>

<!-- HEADER -->
<header id="header">
  <div id="header-title-bar">
    <div id="app-title">Annum</div>
  </div>
  <div id="header-row1">
    <div id="header-info">
      <div id="current-year-display">13.8B BCE</div>
      <div id="era-name-display">Cosmic</div>
    </div>
    <div id="fate-meter">
      <span>⚔️ Villain</span>
      <div id="fate-bar-wrap"><div id="fate-bar-hero" style="width:50%"></div></div>
      <span>Hero 🌟</span>
    </div>
  </div>
  <div id="header-row2">
    <button class="hdr-btn" id="sound-btn" title="Toggle ambient sound">🔇 Sound</button>
    <button class="hdr-btn" id="modal-btn">☰ All Events</button>
    <button class="hdr-btn" id="play-btn">▶ Play</button>
    <select class="hdr-btn" id="speed-select" style="appearance:none;padding:5px 8px;">
      <option value="4000">Slow</option>
      <option value="2500" selected>Normal</option>
      <option value="1200">Fast</option>
    </select>
  </div>
</header>

<!-- MAIN -->
<div id="main">

  <!-- DETAIL PANEL -->
  <div id="detail">
    <div id="detail-bg-gradient"></div>
    <div id="detail-symbol">✨</div>
    <div id="detail-content">
      <div id="detail-card">
        <div id="detail-era-badge">Cosmic</div>
        <div id="detail-year" style="font-size:3rem;">13.8 Billion BCE</div>
        <div class="detail-badges">
          <span id="detail-type-badge" class="badge-hero">Hero</span>
        </div>
        <div id="detail-title">The Big Bang</div>
        <div id="detail-subtitle">The universe born from nothing</div>
        <div id="detail-narrative">Loading…</div>
        <div id="detail-time-gap"></div>
      </div>
    </div>
    <div id="detail-nav-bar">
      <button class="detail-nav" id="nav-prev">← Prev</button>
      <button class="detail-nav" id="nav-next">Next →</button>
    </div>
  </div>

  <!-- RIGHT SCROLLER -->
  <div id="scroller-wrap">
    <div id="cursor-line"></div>
    <div id="scroller"></div>
    <div id="scroller-progress">Event 1 of 85</div>
  </div>

</div>

<!-- YEAR SELECTOR MODAL -->
<div id="modal-overlay" role="dialog" aria-modal="true">
  <div id="modal-header">
    <div id="modal-title">All Events</div>
    <button id="modal-close">✕ Close</button>
  </div>
  <input type="text" id="modal-search" placeholder="Search by year or title…">
  <div id="modal-era-chips"></div>
  <div id="modal-grid"></div>
</div>

<!-- TIME CAPSULE MODAL -->
<div id="capsule-overlay" role="dialog" aria-modal="true">
  <div id="capsule-modal">
    <h3>📬 Time Capsule</h3>
    <p id="capsule-for-label">Leave a note for this moment in history…</p>
    <div class="capsule-notes" id="capsule-existing"></div>
    <textarea id="capsule-text" placeholder="Write your message to the future…"></textarea>
    <div class="capsule-btns">
      <button id="capsule-cancel">Cancel</button>
      <button class="primary" id="capsule-save">Save Note</button>
    </div>
  </div>
</div>

<script>
'use strict';

// ── ERAS ──────────────────────────────────────────────────────────────────────
const ERAS = [
  { name:"Cosmic",              start:-14000000000, end:-4000000001, bg:"#080818", accent:"#9a7ac8", text:"#d8d0f0" },
  { name:"Earth Forms",         start:-4000000000,  end:-600000001,  bg:"#1e0800", accent:"#ff6000", text:"#ffd0a0" },
  { name:"Age of Life",         start:-600000000,   end:-7000001,    bg:"#001a00", accent:"#00bb44", text:"#c0f0c8" },
  { name:"Human Dawn",          start:-7000000,     end:-10001,      bg:"#1a0e00", accent:"#bb7700", text:"#f0d8a0" },
  { name:"Ancient World",       start:-10000,       end:-501,        bg:"#1a1400", accent:"#d4aa00", text:"#f0e8c0" },
  { name:"Classical Antiquity", start:-500,         end:476,         bg:"#0a0a18", accent:"#9090cc", text:"#e0e0f0" },

function getEra(year) {
  return ERAS.find(e => year >= e.start && year <= e.end) || ERAS[ERAS.length - 1];
}

// ── DATE FORMAT ───────────────────────────────────────────────────────────────
function formatYear(y) {
  if (y >= 1000) return y.toString();
  if (y > 0) return y + ' CE';
  const abs = Math.abs(y);
  if (abs >= 1000000000) return (abs/1e9).toFixed(1) + ' Billion BCE';
  if (abs >= 1000000) return (abs/1e6 % 1 === 0 ? abs/1e6 : (abs/1e6).toFixed(1)) + ' Million BCE';
  if (abs >= 1000) return abs.toLocaleString() + ' BCE';
  return abs + ' BCE';
}

function shortYear(y) {
  if (y >= 1000) return y.toString();
  if (y > 0) return y + ' CE';
  const abs = Math.abs(y);
  if (abs >= 1000000000) return (abs/1e9).toFixed(1) + 'B BCE';
  if (abs >= 1000000) return Math.round(abs/1e6) + 'M BCE';
  if (abs >= 1000) return (abs >= 10000 ? Math.round(abs/1000)+'K' : abs.toLocaleString()) + ' BCE';
  return abs + ' BCE';
}

function formatTimeDiff(dy) {
  const abs = Math.abs(dy);
  if (abs >= 1000000000) return (abs/1e9).toFixed(1) + ' billion years';
  if (abs >= 1000000) return Math.round(abs/1e6) + ' million years';
  if (abs >= 1000) return Math.round(abs/1000).toLocaleString() + ',000 years';
  return abs.toLocaleString() + ' years';
}

// ── EVENTS ────────────────────────────────────────────────────────────────────
const EVENTS_RAW = [
  [-13800000000, "hero", "The Big Bang", "The universe born from nothing", "In the beginning there was nothing — not darkness, not space, not time itself. Then, in a singularity smaller than a proton, everything that would ever exist erupted into being. Space expanded, time began, and the laws of physics crystallised from pure energy. Our story — all stories — start here.", "✨"],
  [-13200000000, "hero", "First Stars Ignite", "Light breaks the primordial darkness", "For 200 million years after the Big Bang, the universe was a featureless dark fog of cooling hydrogen and helium. Then gravity, the universe's patient architect, began pulling matter together. The first stars ignited — billions of times brighter than our sun — and the darkness that had ruled all creation was broken at last.", "⭐"],
  [-4500000000, "mixed", "Earth is Born", "A cloud of stellar debris becomes our world", "Five billion years ago, the shockwave from a dying star collapsed a cloud of gas and dust. Gravity did the rest: a spinning disk formed, particles clumped, and a glowing ball of molten rock emerged from the chaos. She was, at first, a hellish place — bombarded by asteroids, her surface a churning ocean of magma. But from this crucible, a world was being forged.", "🌍"],
  [-4000000000, "hero", "Oceans Form", "Water arrives on the young Earth", "Comets and asteroids rained down on the young Earth, carrying water locked in ice. As the planet cooled, steam condensed, and for the first time, liquid water pooled across the surface. The oceans formed — and with them, the chemical soup in which the greatest miracle in the known universe would occur.", "🌊"],
  [-3800000000, "hero", "The First Spark of Life", "Chemistry becomes biology", "In the hydrothermal vents of a young ocean, in conditions we would call hostile to all life, something extraordinary occurred: a chemical reaction became self-replicating. A molecule learned to copy itself. Life — the most improbable thing in the universe — had begun. Against all odds, the hero of our entire story had drawn its first breath.", "🦠"],
  [-2400000000, "hero", "The Great Oxygenation", "Cyanobacteria poison the world and save it", "Tiny cyanobacteria began producing oxygen as a waste product of photosynthesis — and in doing so, caused the largest mass extinction in Earth's history. The anaerobic life that had ruled for a billion years was poisoned by this new gas. But from the ruins emerged a world rich in oxygen, ready for complex life. The villain of one world was the hero of the next.", "💨"],
  [-600000000, "hero", "The Cambrian Explosion", "Complex life erupts in the seas", "For three billion years, life was microscopic and simple. Then, in a geological blink of 20 million years, complex multicellular life exploded into the seas — eyes, shells, appendages, predators, and prey all appeared simultaneously. The Cambrian Explosion was evolution's most creative act, inventing the body plans of virtually every animal that would ever live.", "🐚"],
  [-375000000, "hero", "Life Climbs Ashore", "Fish drag themselves onto land", "For 100 million years, life had conquered the seas. Now came the next great adventure: the first vertebrates hauled themselves out of the water and onto land. Tetrapods — four-limbed, air-breathing creatures — were the heroes who opened a vast new frontier. Every land animal alive today, including you, descends from this moment.", "🦎"],
  [-230000000, "hero", "Rise of the Dinosaurs", "Nature's greatest experiment begins", "After the Permian mass extinction killed 96% of all life, nature rebuilt from the ruins. The dinosaurs emerged: first small and nimble, then growing into forms of breathtaking variety and power. For 165 million years they would rule every continent. Their reign was three times longer than the age of mammals has been so far.", "🦕"],
  [-66000000, "mixed", "The Day the Sky Fell", "An asteroid ends the age of dinosaurs", "A rock six miles wide, travelling 20 kilometres per second, struck what is now Mexico's Yucatan Peninsula with the force of a billion nuclear bombs. The sky darkened for years. The food chain collapsed. Seventy-five percent of all species on Earth perished — including every non-avian dinosaur. The villain that ended one world was the hero that cleared the stage for the next act: the age of mammals.", "☄️"],
  [-7000000, "hero", "A Fork in the Road", "Our ancestors split from the chimpanzee lineage", "In the forests of central Africa, a population of apes diverged forever from the lineage that would become chimpanzees. They could, clumsily at first, stand upright. Bipedalism freed their hands. Their brains would, over millions of years, begin to rewire. They could not yet imagine what they would become. But the heroes of our story had taken their first tentative step.", "🐒"],
  [-3300000, "hero", "Lucy and the First Tools", "Upright hominids shape stone to their will", "A 3.2-million-year-old Australopithecus skeleton — Lucy — tells us our ancestors walked upright on the African savanna. Around the same time, the first deliberately shaped stone tools appeared. A creature that could make tools could solve problems beyond its own body. The hero had acquired its first superpower.", "🪨"],
  [-300000, "hero", "Homo Sapiens Emerges", "The thinking animal appears in Africa", "In the hills of what is now Morocco and Ethiopia, a new kind of primate emerged with a brain capable of art, language, and abstraction. Homo sapiens: the storytelling animal, the tool-making animal, the animal that asks why. Nothing like us had existed in four billion years of life on Earth. Nothing we have since encountered comes close to our combination of creativity and destructive potential.", "🧠"],
  [-70000, "villain", "The Toba Catastrophe", "A supervolcano nearly wipes out humanity", "Mount Toba erupted in Sumatra with a force 10,000 times greater than Mount St. Helens, triggering a volcanic winter that lasted years. Genetic evidence suggests the human population crashed to perhaps 10,000 individuals — a bottleneck that nearly ended our species before it had begun. The villain came from within the Earth. We survived by the narrowest of margins.", "🌋"],
  [-60000, "hero", "Out of Africa", "Humans colonise every corner of the Earth", "A small band of Homo sapiens crossed the Horn of Africa and began spreading across the planet with an audacity no other species had shown. Within 50,000 years, humans had reached Australia, Europe, the Arctic, and eventually the Americas — every habitable continent. Wherever they went, megafauna went extinct. The hero was also a new kind of apex predator.", "🌍"],
  [-40000, "hero", "Art is Born", "Cave paintings illuminate the human imagination", "Deep in the caves of Chauvet and Lascaux, by firelight, human hands traced the forms of animals onto stone walls with astonishing skill. These were not idle doodles: they were the first evidence of symbolic thought, of an imagination that could see the future and remember the past. Art was born — and with it, the possibility of culture, myth, and meaning.", "🎨"],
  [-12000, "hero", "The Neolithic Revolution", "Farming transforms the human story", "The Ice Age ended, the climate warmed, and in the Fertile Crescent of the Middle East, humans made the most consequential decision in their history: to plant seeds and wait. Agriculture produced surplus food, which allowed specialization, which allowed cities, which allowed civilization. The hero planted a seed — and it grew into everything that followed.", "🌾"],
  [-10000, "hero", "Göbekli Tepe", "The world's first temple complex", "Before the wheel, before writing, before cities — humans built a temple. Göbekli Tepe's massive carved stone pillars in southern Turkey were erected 11,500 years ago by hunter-gatherers. It rewrites our understanding of human complexity: religion and monumental architecture preceded farming. The hero needed meaning before it needed bread.", "🏛️"],
  [-7000, "hero", "The First Cities", "Humanity gathers in permanent settlements", "Jericho and Çatalhöyük were among the first permanent human settlements — places where thousands of people lived in proximity, traded, governed, and built. The city was humanity's greatest invention: a machine for concentrating talent, ideas, and surplus. From this point, the pace of human progress would never slow down.", "🏙️"],
  [-4000, "hero", "The Wheel and Writing", "Two inventions that accelerate everything", "The wheel appeared in Mesopotamia — humble, circular, world-changing. Simultaneously, the Sumerians developed cuneiform writing, first to track grain stores, then to record laws, stories, and prayers. With writing, humanity could think across time. Ideas no longer died with their thinkers. Knowledge could accumulate. The hero had invented memory.", "⚙️"],
  [-3500, "hero", "Sumerian Civilization", "The world's first great city-state rises at Uruk", "The city of Uruk swelled to 80,000 people — the largest human settlement the world had ever seen. The Sumerians invented the 60-minute hour, the 360-degree circle, the first legal codes, the first schools, the first beer recipe. They were humanity's first great builders of complexity, wrestling order from chaos with a heroic, systematic intelligence.", "🏺"],
  [-3100, "hero", "Egypt Unified", "The pharaohs rise along the Nile", "Narmer united the kingdoms of Upper and Lower Egypt, establishing one of history's most durable civilizations. Along the Nile, a people developed hieroglyphics, mathematics, medicine, and a theology of cosmic order — Ma'at, the truth that held the universe together. The pharaohs were heroes in their own mythology, and for 3,000 years, their story endured.", "🔺"],
  [-2560, "hero", "The Great Pyramid", "Humanity's most ambitious construction", "100,000 workers spent 20 years moving 2.3 million stone blocks, each weighing 2.5 tonnes, to build a structure so precise that it aligns within 0.05 degrees of true north. The Great Pyramid of Giza is not merely impressive architecture — it is proof of what humans can achieve through organisation, will, and ambition. For 3,800 years, it was the tallest structure on Earth.", "⛰️"],
  [-1792, "hero", "Code of Hammurabi", "Justice written in stone for all to read", "Babylon's King Hammurabi inscribed 282 laws onto an 8-foot basalt stele and placed it in the public square. For the first time, laws were not the secret knowledge of priests and kings but were publicly visible — the same standard for all. 'An eye for an eye' was not barbarism but the radical notion that justice should be equal. A hero of law had arrived.", "⚖️"],
  [-1200, "villain", "The Bronze Age Collapse", "Civilisations crumble across the Mediterranean", "Around 1200 BCE, something catastrophic swept through the Eastern Mediterranean. The Hittite Empire, Mycenaean Greece, Ugarit, and a dozen other Bronze Age civilisations collapsed within decades. Writing systems were forgotten; trade networks shattered; populations plummeted. The cause is still disputed — drought, invasion, internal revolt, or all three. The villain was systemic fragility.", "💀"],
  [-776, "hero", "The First Olympics", "Greece unites through peaceful competition", "Every four years, all Greek city-states declared a truce and gathered at Olympia for athletic competition. The Olympics were the heroic dream of a fractious people: the idea that rivals could settle disputes through sport rather than slaughter. They ran, wrestled, threw, and for a moment, the Mediterranean's most argumentative culture found peace in shared excellence.", "🏅"],
  [-753, "hero", "Rome is Founded", "A city on seven hills begins its long story", "According to legend, Romulus drew a line around the Palatine Hill and called it Rome. What began as a small village of Latin farmers on the Tiber River would become the most successful political entity in Western history. The hero of this story is the idea of Rome — a city that kept reinventing itself, from kingdom to republic to empire, for over a thousand years.", "🏛️"],
  [-563, "hero", "Birth of the Buddha", "A prince awakens under a Bodhi tree", "Siddhartha Gautama, born a prince in what is now Nepal, abandoned his palace at 29 to understand human suffering. After years of asceticism and meditation, he attained enlightenment under a Bodhi tree and spent the next 45 years teaching the Middle Way — that suffering arises from attachment and can be ended. His teaching would eventually reach half the world.", "🪷"],
  [-509, "hero", "The Roman Republic", "Rome invents shared governance", "Having expelled their last king, the Romans established a Republic — two annually elected consuls, a senate, and the principle that no single man should hold absolute power. It was imperfect (only wealthy men voted), but it was the most sophisticated experiment in collective governance the Western world had seen, and its echoes reached every democracy that followed.", "🏛️"],
  [-490, "hero", "Battle of Marathon", "Greece defies the Persian Empire", "Persia's army of 25,000 landed at Marathon, expecting to crush the small Greek city-states. Instead, 10,000 Athenian hoplites charged at a run and drove the invaders back to their ships. The victory was more than military — it proved that citizen-soldiers fighting for their own freedom could defeat a conscript army fighting for an emperor. Democracy had its first great battle.", "🏃"],
  [-399, "villain", "Socrates Executed", "Athens kills its wisest man", "Socrates spent his life in the Athenian agora asking uncomfortable questions. His method — the Socratic dialogue — exposed the ignorance of those who thought they knew. Athens put him on trial for 'corrupting the youth' and 'impiety.' He refused to flee and drank the hemlock with calm dignity. The villain was not Socrates; it was the mob's fear of honest inquiry.", "🍷"],
  [-336, "mixed", "Alexander the Great", "A young king conquers the world", "At 20, Alexander of Macedon inherited his father's army and an ambition no map could contain. By 30, he had conquered an empire stretching from Greece to India — fighting 70 battles and losing none. He spread Greek culture, science, and philosophy across three continents. He was both hero and destroyer, liberator and conqueror, depending on which side of his spear you stood.", "⚡"],
  [-44, "mixed", "The Ides of March", "Julius Caesar falls; the Republic dies with him", "On March 15th, 44 BCE, twenty-three senators stabbed Julius Caesar 23 times in the Theatre of Pompey. The assassins believed they were saving the Republic; instead, they destroyed it. Caesar's death triggered civil wars that ended only when his heir Augustus seized power and became Rome's first emperor. The heroes who killed a tyrant had birthed an empire.", "🗡️"],
  [1, "hero", "Birth of Jesus of Nazareth", "A carpenter's son divides history in two", "In a Judean province of the Roman Empire, a child was born who would, within three centuries, transform the world's most powerful empire — and ultimately most of Western civilisation. Whether divine or entirely human, Jesus of Nazareth spoke of love, forgiveness, and the dignity of the poor with such force that his words are still read by 2.4 billion people today. History's most influential story begins here.", "⭐"],
  [79, "villain", "Vesuvius Buries Pompeii", "A city preserved in ash for 1,700 years", "On August 24th, Mount Vesuvius erupted with a force 100,000 times more powerful than Hiroshima, burying the Roman city of Pompeii under 20 feet of ash in hours. Two thousand people died where they stood. The villain was geological — but the miracle was preservation: Pompeii emerged in the 18th century as a perfect snapshot of Roman daily life, teaching us more about ancient civilisation than any text.", "🌋"],
  [313, "hero", "Edict of Milan", "Constantine legalises Christianity; history pivots", "Emperor Constantine's Edict of Milan granted religious freedom across the Roman Empire — and in doing so, gave Christianity the space to grow from persecuted sect to imperial religion. Within 70 years, Christianity was Rome's official faith. The hero of this story is tolerance — the radical idea that the state should not dictate what its citizens believe — even if its long-term consequence was intolerance.", "✝️"],
  [476, "villain", "Fall of Western Rome", "The ancient world ends", "On September 4th, 476 CE, the Germanic chieftain Odoacer deposed the last Western Roman Emperor, 16-year-old Romulus Augustulus. The Roman administrative system that had governed Western Europe for 500 years collapsed. Roads fell into disrepair; cities shrank; literacy declined. The villain was not Odoacer but the slow rot of a civilisation from within. The medieval world began.", "💀"],
  [570, "hero", "Birth of Muhammad", "The Prophet of Islam is born in Mecca", "In the city of Mecca, in 570 CE, a boy named Muhammad was born who would, over the next century after his death, inspire one of the most rapid civilisational expansions in history. His revelation — the Quran — spoke of one God, social justice, and the equality of believers. The Islamic Golden Age that followed preserved classical knowledge through Europe's Dark Ages and advanced mathematics, astronomy, and medicine.", "🌙"],
  [800, "hero", "Charlemagne Crowned", "A unified Christian Europe is imagined", "On Christmas Day 800, Pope Leo III crowned Charlemagne Holy Roman Emperor in St. Peter's Basilica — the first time a Western ruler had claimed the mantle of Rome in three centuries. Charlemagne standardised weights and measures, promoted literacy, and created a common law across much of Europe. He imagined, for the first time, a Christian Europe as a single civilisation.", "👑"],
  [1000, "hero", "Leif Eriksson in America", "Europe reaches a new world — 500 years before Columbus", "The Norse sagas tell of Leif Eriksson's voyage west from Greenland to a place he called Vinland — almost certainly the coast of Newfoundland. Archaeological evidence confirms a Viking settlement at L'Anse aux Meadows, Canada, around 1000 CE. The hero reached the Americas first, but the encounter left no lasting trace — the world was not yet ready for the collision of civilisations.", "⛵"],
  [1215, "hero", "Magna Carta", "The first limits on royal power, written in law", "Forced by rebellious barons to sign a charter at Runnymede, King John of England agreed that even a king was not above the law. Magna Carta established that no free man could be imprisoned without a lawful judgment of his peers — the seed of habeas corpus, constitutional government, and the rule of law. The hero was not the king, but the idea that power must be constrained.", "📜"],
  [1347, "villain", "The Black Death", "Plague kills one-third of Europe", "The Yersinia pestis bacterium, carried by fleas on rats along the Silk Road, arrived in Europe in 1347 and swept through a continent with no immunity. Within five years, 25 million people — one-third of Europe's population — were dead. Entire villages vanished. The social order cracked: labour was scarce, serfs gained power, the Church lost authority. The villain of the Black Death was also, in its terrible way, an accelerant of change.", "💀"],
  [1440, "hero", "Gutenberg's Printing Press", "The information revolution begins", "Johannes Gutenberg's movable type printing press made books cheap enough for ordinary people to own. Within 50 years of its invention, 20 million books were in circulation across Europe — more than had been produced in the previous thousand years. The press broke the Church's monopoly on information, enabled the Reformation, the Scientific Revolution, and eventually democracy itself. The hero had invented the internet of its age.", "📖"],
  [1453, "villain", "Fall of Constantinople", "The Byzantine Empire ends after 1,000 years", "On May 29th, 1453, Ottoman cannons breached the walls of Constantinople and Sultan Mehmed II rode his horse into the Hagia Sophia. The Eastern Roman Empire — the direct continuation of Rome — ended after 1,500 years. Byzantine scholars fled to Italy carrying ancient Greek manuscripts, helping ignite the Renaissance. The villain's conquest accidentally gave birth to a flowering of Western culture.", "🔥"],
  [1492, "mixed", "Columbus Reaches the Americas", "Two worlds collide — wonder and catastrophe", "On October 12th, Christopher Columbus made landfall in the Bahamas and two previously separate branches of humanity met for the first time. The hero saw it as discovery; the 60 million people who already lived in the Americas experienced it as the beginning of a catastrophe. The Columbian Exchange that followed transformed the diet, ecology, and disease landscape of the entire planet. Both things were true simultaneously.", "🌊"],
  [1517, "hero", "Martin Luther's 95 Theses", "A monk challenges a thousand years of Church power", "Martin Luther nailed his 95 Theses to the door of a Wittenberg church and triggered the most consequential religious revolution since Christianity itself. His argument — that salvation came through faith alone, not the Church's sacraments — spread with terrifying speed via Gutenberg's press. The Protestant Reformation shattered the unity of Western Christianity and gave birth to the modern concept of individual conscience.", "📜"],
  [1543, "hero", "Copernicus — Earth Orbits the Sun", "The greatest scientific revolution begins", "Nicolaus Copernicus published 'On the Revolutions of the Celestial Spheres' on his deathbed, arguing that the Earth orbits the Sun — not vice versa. It seemed like a minor astronomical technicality. In fact, it removed humanity from the centre of the cosmos and began the Scientific Revolution that would give us vaccines, computers, nuclear power, and the ability to walk on the Moon.", "🔭"],
  [1609, "hero", "Galileo's Telescope", "The sky is revealed for the first time", "Galileo turned a lens to the heavens and saw what no human had seen before: mountains on the Moon, moons orbiting Jupiter, phases of Venus. His observations confirmed Copernicus and began a war with the Church that would end with him under house arrest. The hero of this story is empirical observation — the radical insistence that reality be the judge of theory, not authority.", "🔭"],
  [1687, "hero", "Newton's Principia Mathematica", "The laws of motion and gravity — physics born", "In a single book, Isaac Newton unified the motions of the heavens and the Earth under three laws of motion and the law of universal gravitation. He invented calculus to do it. Newton's achievement was not merely scientific — it was philosophical: the universe was not governed by divine whim but by mathematics, and mathematics could be read by any human mind. The hero had found the universe's user manual.", "📐"],
  [1776, "hero", "American Independence", "Life, liberty, and the pursuit of happiness", "Fifty-six men signed a document declaring that all men were created equal and endowed with certain unalienable rights. The Declaration of Independence was an act of extraordinary political courage and philosophical ambition — and a glaring hypocrisy, written by men who owned slaves. Its ideals were better than its authors, and would take centuries to approach fulfilment. The hero was the idea, not the men.", "🗽"],
  [1789, "mixed", "The French Revolution", "Liberty, Equality, Fraternity — then the guillotine", "The storming of the Bastille on July 14th, 1789 began the most radical political transformation in Western history since Rome. The Declaration of the Rights of Man and the Citizen proclaimed universal human rights. Then came the Terror, the guillotine, and Napoleon. The hero and villain were the same revolution — liberty's most intoxicating and most dangerous expression.", "🔥"],
  [1807, "hero", "Slave Trade Abolished", "Britain bans the trade — an empire turns", "After decades of campaigning by abolitionists like William Wilberforce and the testimony of enslaved Africans like Olaudah Equiano, the British Parliament voted to abolish the slave trade in 1807. The Royal Navy's West Africa Squadron then spent 60 years intercepting slave ships. It was not the end of slavery — but it was the moment an empire looked at its greatest crime and flinched.", "⛓️"],
  [1859, "hero", "Big Ben Rings; Darwin Publishes", "The Victorian age at its zenith — and a theory that changes everything", "Big Ben's great bell tolled for the first time above Westminster, the heartbeat of the world's greatest empire. On the same year, Charles Darwin published 'On the Origin of Species' — the most dangerous idea in the history of science: that all life on Earth, including humanity, was shaped by natural selection over billions of years, not divine creation. Two clocks began counting simultaneously.", "🔔"],
  [1865, "mixed", "The Civil War Ends; Lincoln Falls", "Slavery abolished; the hero who ends it is killed", "The United States survived its greatest crisis: 620,000 dead, the Union preserved, and the 13th Amendment abolished slavery forever. Then, five days after Lee's surrender, John Wilkes Booth shot Abraham Lincoln at Ford's Theatre. The president who had held the nation together through its darkest years did not survive to see its healing. The hero was killed at the moment of his greatest triumph.", "🎭"],
  [1869, "hero", "The World Shrinks", "Suez Canal and Transcontinental Railroad in one year", "In 1869, the Suez Canal joined the Mediterranean to the Red Sea, slicing 7,000 km off the route from Europe to Asia. The same year, a golden spike was driven at Promontory Summit, Utah, completing the American transcontinental railroad. In twelve months, the world became dramatically, permanently smaller. Distance — the ancient guardian of separation — was in full retreat.", "🚂"],
  [1876, "hero", "Hello, World", "Bell invents the telephone", "Alexander Graham Bell spoke six words into a wire — 'Mr. Watson, come here, I want to see you' — and the age of instant communication began. The telephone collapsed the distance between human voices. For the first time in history, a person could speak in real time to someone miles away. The hero had given speech wings.", "📞"],
  [1879, "hero", "Light for Everyone", "Edison's practical light bulb", "Thomas Edison's incandescent bulb burned steadily for 40 hours in a Menlo Park laboratory, and night was never quite as dark again. Combined with his direct current electrical distribution system, Edison had a plan to light every home, workshop, and street in the world. Within decades, artificial light had reshaped human sleep, work, and leisure. The hero had conquered darkness.", "💡"],
  [1889, "hero", "The Iron Tower", "Eiffel Tower completed; Paris reimagined", "Gustave Eiffel built a 300-metre iron lattice tower in two years for the 1889 World's Fair — mocked as an eyesore, then beloved as an icon. The Eiffel Tower was not merely beautiful; it proved that iron and engineering could reach for the sky in ways stone never could. It was a monument to the Victorian faith that human ingenuity had no ceiling.", "🗼"],
  [1895, "hero", "X-rays and Cinema", "Röntgen sees through flesh; Lumière captures motion", "Wilhelm Röntgen accidentally discovered X-rays and photographed his wife's hand — she saw her own skeleton and reportedly said 'I have seen my death.' Weeks later, the Lumière brothers showed the first paying cinema audience a moving picture of a train arriving at a station. In 1895, humanity simultaneously gained the ability to see inside living bodies and to capture and replay time itself.", "🎬"],

let currentIndex = 0;

// ── AUDIO ────────────────────────────────────────────────────────────────────
function getAudioCtx() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  return audioCtx;
}

function stopAllSound() {
  activeNodes.forEach(n => { try { n.stop(); } catch(e) {} });
  activeNodes = [];
}

// Era-based ambient sound profiles
const ERA_SOUNDS = {
  "Cosmic":              { type: 'sine',     freq: 55,   gain: 0.08, detune: 0 },
  "Earth Forms":         { type: 'sawtooth', freq: 40,   gain: 0.05, detune: -5 },
  "Age of Life":         { type: 'sine',     freq: 110,  gain: 0.06, detune: 7 },
  "Human Dawn":          { type: 'triangle', freq: 130,  gain: 0.07, detune: 0 },
  "Ancient World":       { type: 'sine',     freq: 174,  gain: 0.07, detune: 0 },
  "Classical Antiquity": { type: 'sine',     freq: 220,  gain: 0.07, detune: 0 },
  "Early Medieval":      { type: 'triangle', freq: 185,  gain: 0.07, detune: -12 },
  "High Medieval":       { type: 'triangle', freq: 196,  gain: 0.07, detune: -10 },
  "Renaissance":         { type: 'sine',     freq: 261,  gain: 0.06, detune: 0 },
  "Age of Reason":       { type: 'sine',     freq: 293,  gain: 0.06, detune: 4 },
  "Revolution":          { type: 'sawtooth', freq: 220,  gain: 0.05, detune: -8 },
  "Victorian":           { type: 'sine',     freq: 330,  gain: 0.06, detune: 0 },
  "Edwardian":           { type: 'sine',     freq: 349,  gain: 0.05, detune: 2 },
  "Great War":           { type: 'sawtooth', freq: 110,  gain: 0.07, detune: -15 },
  "Roaring 20s":         { type: 'sine',     freq: 392,  gain: 0.07, detune: 0 },
  "Depression":          { type: 'triangle', freq: 146,  gain: 0.06, detune: -7 },
  "WWII":                { type: 'sawtooth', freq: 98,   gain: 0.07, detune: -12 },
  "Cold War":            { type: 'sine',     freq: 220,  gain: 0.06, detune: -5 },
  "Space Age":           { type: 'sine',     freq: 440,  gain: 0.05, detune: 7 },
  "Turbulent 70s":       { type: 'triangle', freq: 196,  gain: 0.06, detune: -3 },
  "Neon 80s":            { type: 'sawtooth', freq: 523,  gain: 0.05, detune: 5 },
  "Digital Revolution":  { type: 'sine',     freq: 587,  gain: 0.05, detune: 0 },
  "New Millennium":      { type: 'sine',     freq: 659,  gain: 0.05, detune: 2 },
  "Social Age":          { type: 'sine',     freq: 698,  gain: 0.05, detune: 3 },
  "Crisis Era":          { type: 'triangle', freq: 311,  gain: 0.06, detune: -4 },
};

function playEraSound(eraName) {
  if (!soundEnabled) return;
  stopAllSound();
  const ctx = getAudioCtx();
  const profile = ERA_SOUNDS[eraName] || { type: 'sine', freq: 220, gain: 0.06, detune: 0 };

  // Base oscillator
  const osc = ctx.createOscillator();
  const gainNode = ctx.createGain();
  osc.type = profile.type;
  osc.frequency.value = profile.freq;
  osc.detune.value = profile.detune;
  gainNode.gain.setValueAtTime(0, ctx.currentTime);
  gainNode.gain.linearRampToValueAtTime(profile.gain, ctx.currentTime + 0.8);
  osc.connect(gainNode);
  gainNode.connect(ctx.destination);
  osc.start();
  activeNodes.push(osc);

  // Sub harmonic for depth
  if (profile.freq < 300) {
    const osc2 = ctx.createOscillator();
    const gain2 = ctx.createGain();
    osc2.type = 'sine';
    osc2.frequency.value = profile.freq * 1.5;
    gain2.gain.setValueAtTime(0, ctx.currentTime);
    gain2.gain.linearRampToValueAtTime(profile.gain * 0.4, ctx.currentTime + 1.2);
    osc2.connect(gain2);
    gain2.connect(ctx.destination);
    osc2.start();
    activeNodes.push(osc2);
  }

  // Fade out after 4s
  gainNode.gain.setTargetAtTime(0, ctx.currentTime + 3.5, 0.5);
}

// ── HEROIC MELODY (autoplay accompaniment) ────────────────────────────────────
const HEROIC_NOTES = [261.63, 329.63, 392.00, 523.25, 659.25, 523.25, 392.00, 329.63];
let heroicNoteIdx = 0;
function playHeroicNote() {
  if (!soundEnabled) return;
  const ctx = getAudioCtx();
  const freq = HEROIC_NOTES[heroicNoteIdx % HEROIC_NOTES.length];
  heroicNoteIdx++;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  const filter = ctx.createBiquadFilter();
  osc.type = 'triangle';
  osc.frequency.value = freq;
  filter.type = 'lowpass';
  filter.frequency.value = 1800;
  filter.Q.value = 0.7;
  const t = ctx.currentTime;
  gain.gain.setValueAtTime(0, t);
  gain.gain.linearRampToValueAtTime(0.16, t + 0.04);
  gain.gain.setValueAtTime(0.12, t + 0.3);
  gain.gain.linearRampToValueAtTime(0, t + 0.7);
  osc.connect(filter);
  filter.connect(gain);
  gain.connect(ctx.destination);
  osc.start(t);
  osc.stop(t + 0.9);
}

// ── SCROLLER BUILD ────────────────────────────────────────────────────────────
// Compute top padding so first item can reach cursor line (33% from top)
// We'll insert a spacer div at top of scroller
function buildScroller() {
  elScroller.innerHTML = '';

  // Top spacer: cursor is at 33% of scroller height.
  // To allow first item centered at cursor, we need padding = 33% of clientHeight - 22px (half item height)
  // We do this dynamically after render.
  const topSpacer = document.createElement('div');
  topSpacer.id = 'scroller-top-spacer';
  elScroller.appendChild(topSpacer);

  let lastEraName = null;

  EVENTS.forEach((ev, idx) => {
    const era = ev.era;

    // Era header
    if (era.name !== lastEraName) {
      lastEraName = era.name;
      const header = document.createElement('div');
      header.className = 'era-header';
      header.textContent = era.name;
      header.style.color = era.accent;
      elScroller.appendChild(header);
    }

    // Item row
    const item = document.createElement('div');
    item.className = 'scroll-item';
    item.dataset.idx = idx;
    item.style.borderLeftColor = 'transparent';

    const dot = document.createElement('div');
    dot.className = 'scroll-dot';
    dot.style.background = era.accent;

    const yearEl = document.createElement('div');
    yearEl.className = 'scroll-year';
    yearEl.style.color = era.text;
    yearEl.textContent = shortYear(ev.year);

    const titleEl = document.createElement('div');
    titleEl.className = 'scroll-title';
    titleEl.style.color = era.text;
    titleEl.textContent = ev.title;

    item.appendChild(dot);
    item.appendChild(yearEl);
    item.appendChild(titleEl);

    item.addEventListener('click', () => navigateTo(idx, true));
    elScroller.appendChild(item);
  });

  // Bottom spacer so last item can reach cursor line
  const bottomSpacer = document.createElement('div');
  bottomSpacer.id = 'scroller-bottom-spacer';
  elScroller.appendChild(bottomSpacer);

  updateScrollerSpacers();
}

function updateScrollerSpacers() {
  const cursorY = elScroller.clientHeight * 0.33;
  const itemHalf = 22; // half of 44px
  const topSpacer = document.getElementById('scroller-top-spacer');
  const botSpacer = document.getElementById('scroller-bottom-spacer');
  if (topSpacer) topSpacer.style.height = Math.max(0, cursorY - itemHalf) + 'px';
  if (botSpacer) botSpacer.style.height = Math.max(0, elScroller.clientHeight - cursorY - itemHalf) + 'px';
}

function getScrollItems() {
  return Array.from(elScroller.querySelectorAll('.scroll-item'));
}

// ── NAVIGATION ───────────────────────────────────────────────────────────────
let isScrollingProgrammatically = false;

function navigateTo(idx, fromClick) {
  idx = Math.max(0, Math.min(EVENTS.length - 1, idx));
  if (idx === currentIndex && !fromClick) return;
  currentIndex = idx;

  // Scroll scroller so item center aligns with cursor (33% from top)
  scrollItemToCursor(idx);

  // Update detail panel
  updateDetailPanel(EVENTS[idx]);

  // Update header
  const ev = EVENTS[idx];
  elCurrentYear.textContent = shortYear(ev.year);
  elEraName.textContent = ev.era.name;

  // Update CSS vars
  document.documentElement.style.setProperty('--bg', ev.era.bg);
  document.documentElement.style.setProperty('--accent', ev.era.accent);
  document.documentElement.style.setProperty('--text', ev.era.text);
  document.body.style.backgroundColor = ev.era.bg;

  // Update scroller active state
  updateActiveItem(idx);

  // Update progress
  elProgress.textContent = `Event ${idx + 1} of ${EVENTS.length}`;

  // Sound
  playEraSound(ev.era.name);
}

function scrollItemToCursor(idx) {
  const items = getScrollItems();
  if (!items[idx]) return;

  const cursorY = elScroller.clientHeight * 0.33;
  // We need: scrollTop + cursorY = item.offsetTop + 22 (center of item)
  const item = items[idx];
  const targetScroll = item.offsetTop + 22 - cursorY;

  isScrollingProgrammatically = true;
  elScroller.scrollTo({ top: targetScroll, behavior: 'smooth' });
  setTimeout(() => { isScrollingProgrammatically = false; }, 500);
}

function updateActiveItem(idx) {
  const items = getScrollItems();
  items.forEach((item, i) => {
    const isActive = i === idx;
    item.classList.toggle('active', isActive);
    const ev = EVENTS[i];
    item.style.borderLeftColor = isActive ? ev.era.accent : 'transparent';
  });
}

// ── DETAIL PANEL UPDATE ────────────────────────────────────────────────────────
let fadeTimeout = null;
function updateDetailPanel(ev) {
  // Fade out
  elDetailContent.classList.add('fading');
  if (fadeTimeout) clearTimeout(fadeTimeout);
  fadeTimeout = setTimeout(() => {
    // Update content
    const yearStr = formatYear(ev.year);
    elEraBadge.textContent = ev.era.name;
    elEraBadge.style.color = ev.era.accent;
    elEraBadge.style.borderColor = ev.era.accent;

    // Dynamic font size for year
    const yearLen = yearStr.length;
    const fs = yearLen > 18 ? '1.6rem' : yearLen > 13 ? '2rem' : yearLen > 9 ? '2.5rem' : '3rem';
    elDetailYear.style.fontSize = fs;
    elDetailYear.textContent = yearStr;

    elTypeBadge.textContent = ev.type.charAt(0).toUpperCase() + ev.type.slice(1);
    elTypeBadge.className = 'detail-type-badge badge-' + ev.type;

    elTitle.textContent = ev.title;
    elSubtitle.textContent = ev.subtitle;
    elNarrative.textContent = ev.narrative;
    elDetailSymbol.textContent = ev.symbol;

    // Time gap
    const idx = EVENTS.indexOf(ev);
    if (idx > 0) {
      const prev = EVENTS[idx - 1];
      const diff = ev.year - prev.year;
      const diffStr = formatTimeDiff(Math.abs(diff));
      elTimeGap.textContent = diff >= 0
        ? `↔ ${diffStr} after previous event`
        : `↔ ${diffStr} before previous event`;
    } else {
      elTimeGap.textContent = '↔ The beginning of all things';
    }

    // Fade in
    elDetailContent.classList.remove('fading');
  }, 350);
}

// ── SCROLL DETECTION ──────────────────────────────────────────────────────────
let rafPending = false;

function onScrollerScroll() {
  if (isScrollingProgrammatically) return;
  if (rafPending) return;
  rafPending = true;
  requestAnimationFrame(() => {
    rafPending = false;
    findActiveFromScroll();
  });
}

function findActiveFromScroll() {
  const cursorY = elScroller.scrollTop + elScroller.clientHeight * 0.33;
  const items = getScrollItems();
  let bestIdx = 0;
  let bestDist = Infinity;

  items.forEach((item, i) => {
    const itemCenter = item.offsetTop + 22;
    const dist = Math.abs(itemCenter - cursorY);
    if (dist < bestDist) {
      bestDist = dist;
      bestIdx = i;
    }
  });

  if (bestIdx !== currentIndex) {
    currentIndex = bestIdx;
    const ev = EVENTS[bestIdx];

    // Update detail panel
    updateDetailPanel(ev);

    // Update header
    elCurrentYear.textContent = shortYear(ev.year);
    elEraName.textContent = ev.era.name;

    // Update CSS vars
    document.documentElement.style.setProperty('--bg', ev.era.bg);
    document.documentElement.style.setProperty('--accent', ev.era.accent);
    document.documentElement.style.setProperty('--text', ev.era.text);
    document.body.style.backgroundColor = ev.era.bg;

    // Active item in scroller
    updateActiveItem(bestIdx);

    elProgress.textContent = `Event ${bestIdx + 1} of ${EVENTS.length}`;

    playEraSound(ev.era.name);
  }
}

elScroller.addEventListener('scroll', onScrollerScroll, { passive: true });

// ── TOUCH: only forward from scroller strip, not from detail panel ────────────
let touchStartY = 0;
function setupTouch(el) {
  el.addEventListener('touchstart', (e) => { touchStartY = e.touches[0].clientY; }, { passive: true });
  el.addEventListener('touchmove', (e) => {
    const dy = touchStartY - e.touches[0].clientY;
    touchStartY = e.touches[0].clientY;
    elScroller.scrollBy({ top: dy });
  }, { passive: true });
}
setupTouch(elScroller);

// ── KEYBOARD ─────────────────────────────────────────────────────────────────
document.addEventListener('keydown', (e) => {
  if (document.getElementById('modal-overlay').classList.contains('open')) {
    if (e.key === 'Escape') closeModal();
    return;
  }
  if (document.getElementById('capsule-overlay').classList.contains('open')) {
    if (e.key === 'Escape') closeCapsule();
    return;
  }
  if (e.key === 'ArrowDown' || e.key === 'ArrowRight') {
    e.preventDefault();
    navigateTo(currentIndex + 1);
  } else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
    e.preventDefault();
    navigateTo(currentIndex - 1);
  }
});

// ── NAVIGATION BUTTONS ────────────────────────────────────────────────────────
document.getElementById('nav-prev').addEventListener('click', () => navigateTo(currentIndex - 1));
document.getElementById('nav-next').addEventListener('click', () => navigateTo(currentIndex + 1));

// ── PLAY/PAUSE ────────────────────────────────────────────────────────────────
function togglePlay() {
  isPlaying = !isPlaying;
  elPlayBtn.textContent = isPlaying ? '⏸ Pause' : '▶ Play';
  elPlayBtn.classList.toggle('active', isPlaying);
  if (isPlaying) scheduleNext();
  else if (playTimer) { clearTimeout(playTimer); playTimer = null; }
}

function scheduleNext() {
  if (!isPlaying) return;
  const speed = parseInt(elSpeedSelect.value);
  playTimer = setTimeout(() => {
    if (currentIndex >= EVENTS.length - 1) {
      togglePlay();
      return;
    }
    navigateTo(currentIndex + 1);
    playHeroicNote();
    scheduleNext();
  }, speed);
}

elPlayBtn.addEventListener('click', togglePlay);

// ── SOUND ────────────────────────────────────────────────────────────────────
elSoundBtn.addEventListener('click', () => {
  soundEnabled = !soundEnabled;
  elSoundBtn.textContent = soundEnabled ? '🔊 Sound' : '🔇 Sound';
  elSoundBtn.classList.toggle('active', soundEnabled);
  if (!soundEnabled) stopAllSound();
  else playEraSound(EVENTS[currentIndex].era.name);
});

// ── MODAL ─────────────────────────────────────────────────────────────────────
const modalOverlay = document.getElementById('modal-overlay');
const modalGrid    = document.getElementById('modal-grid');
const modalSearch  = document.getElementById('modal-search');
const modalChips   = document.getElementById('modal-era-chips');

function buildModal() {
  // Era chips
  ERAS.forEach(era => {
    const chip = document.createElement('div');
    chip.className = 'era-chip';
    chip.textContent = era.name;
    chip.style.borderColor = era.accent;
    chip.style.color = era.accent;
    chip.addEventListener('click', () => {
      const idx = EVENTS.findIndex(e => e.era.name === era.name);
      if (idx >= 0) {
        closeModal();
        navigateTo(idx, true);
      }
    });
    modalChips.appendChild(chip);
  });

  renderModalGrid('');
}

function parseYearQuery(q) {
  // Accept: "1969", "-44", "44 bce", "44 bc", "500 ce", etc.
  const isBce = /\b(bce|bc|b\.c\.)\b/.test(q);
  const numMatch = q.match(/-?\d+/);
  if (!numMatch) return null;
  let n = parseInt(numMatch[0], 10);
  if (isBce && n > 0) n = -n;
  return n;
}

function addModalCell(ev, idx, closest) {
  const cell = document.createElement('div');
  cell.className = 'modal-item';
  cell.style.borderLeftColor = ev.era.accent;
  if (closest) cell.style.outline = `1px dashed ${ev.era.accent}`;

  const yr = document.createElement('div');
  yr.className = 'modal-item-year';
  yr.style.color = ev.era.accent;
  yr.textContent = formatYear(ev.year);

  const tl = document.createElement('div');
  tl.className = 'modal-item-title';
  tl.style.color = ev.era.text;
  tl.textContent = ev.title;

  cell.appendChild(yr);
  cell.appendChild(tl);

  if (closest) {
    const hint = document.createElement('div');
    hint.style.cssText = 'font-size:0.65rem;opacity:0.5;margin-top:5px;font-style:italic;';
    hint.textContent = 'Closest event to your search';
    cell.appendChild(hint);
  }

  cell.addEventListener('click', () => { closeModal(); navigateTo(idx, true); });
  modalGrid.appendChild(cell);
}

function renderModalGrid(query) {
  modalGrid.innerHTML = '';
  const q = query.toLowerCase().trim();

  if (!q) {
    EVENTS.forEach((ev, idx) => addModalCell(ev, idx, false));
    return;
  }

  // Normal text/year/era filter
  const hits = [];
  EVENTS.forEach((ev, idx) => {
    if (ev.title.toLowerCase().includes(q) ||
        formatYear(ev.year).toLowerCase().includes(q) ||
        ev.era.name.toLowerCase().includes(q)) {
      hits.push(idx);
    }
  });

  if (hits.length > 0) {
    hits.forEach(idx => addModalCell(EVENTS[idx], idx, false));
    return;
  }

  // No text match — try to parse as a year and find the closest event
  const parsedYear = parseYearQuery(q);
  if (parsedYear !== null) {
    let bestIdx = 0, bestDist = Infinity;
    EVENTS.forEach((ev, idx) => {
      const d = Math.abs(ev.year - parsedYear);
      if (d < bestDist) { bestDist = d; bestIdx = idx; }
    });
    addModalCell(EVENTS[bestIdx], bestIdx, true);
  } else {
    const msg = document.createElement('div');
    msg.style.cssText = 'grid-column:1/-1;text-align:center;padding:2rem;opacity:0.4;font-style:italic;';
    msg.textContent = 'No events found';
    modalGrid.appendChild(msg);
  }
}

modalSearch.addEventListener('input', () => renderModalGrid(modalSearch.value));

function openModal() {
  modalOverlay.classList.add('open');
  modalSearch.value = '';
  renderModalGrid('');
  modalSearch.focus();
}

function closeModal() {
  modalOverlay.classList.remove('open');
}

document.getElementById('modal-btn').addEventListener('click', openModal);
document.getElementById('modal-close').addEventListener('click', closeModal);
modalOverlay.addEventListener('click', (e) => { if (e.target === modalOverlay) closeModal(); });

// ── TIME CAPSULE ──────────────────────────────────────────────────────────────
const capsuleOverlay   = document.getElementById('capsule-overlay');
const capsuleText      = document.getElementById('capsule-text');
const capsuleExisting  = document.getElementById('capsule-existing');
const capsuleForLabel  = document.getElementById('capsule-for-label');

function getCapsuleKey(idx) {
  return `annum_capsule_${idx}`;
}

function openCapsule() {
  const ev = EVENTS[currentIndex];
  capsuleForLabel.textContent = `Leave a note for: ${ev.title} (${formatYear(ev.year)})`;
  capsuleText.value = '';

  // Show existing notes
  capsuleExisting.innerHTML = '';
  const key = getCapsuleKey(currentIndex);
  let notes = [];
  try { notes = JSON.parse(localStorage.getItem(key) || '[]'); } catch(e) {}
  if (notes.length > 0) {
    const heading = document.createElement('div');
    heading.style.cssText = 'font-size:0.72rem;opacity:0.5;margin-bottom:6px;';
    heading.textContent = `Your previous notes (${notes.length}):`;
    capsuleExisting.appendChild(heading);
    notes.slice(-3).forEach(note => {
      const div = document.createElement('div');
      div.className = 'capsule-note-item';
      const dateDiv = document.createElement('div');
      dateDiv.className = 'capsule-note-date';
      dateDiv.textContent = note.date;
      const textDiv = document.createElement('div');
      textDiv.textContent = note.text;
      div.appendChild(dateDiv);
      div.appendChild(textDiv);
      capsuleExisting.appendChild(div);
    });
  }

  capsuleOverlay.classList.add('open');
  capsuleText.focus();
}

function closeCapsule() {
  capsuleOverlay.classList.remove('open');
}

function saveCapsule() {
  const text = capsuleText.value.trim();
  if (!text) return;
  const key = getCapsuleKey(currentIndex);
  let notes = [];
  try { notes = JSON.parse(localStorage.getItem(key) || '[]'); } catch(e) {}
  notes.push({ text, date: new Date().toLocaleDateString('en-GB', { year:'numeric', month:'long', day:'numeric' }) });
  localStorage.setItem(key, JSON.stringify(notes));
  closeCapsule();
}

document.getElementById('capsule-cancel').addEventListener('click', closeCapsule);
document.getElementById('capsule-save').addEventListener('click', saveCapsule);
capsuleOverlay.addEventListener('click', (e) => { if (e.target === capsuleOverlay) closeCapsule(); });

// ── RESIZE ───────────────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  updateScrollerSpacers();
  // Re-scroll to current item
  setTimeout(() => scrollItemToCursor(currentIndex), 50);
});

// ── INIT ──────────────────────────────────────────────────────────────────────
function init() {
  buildScroller();
  buildModal();
  updateFateMeter();

  // Small delay so layout is complete before computing positions
  setTimeout(() => {
    navigateTo(0, true);
  }, 80);
}

init();
</script>
</body>
